version: "3.8"

services:
  # FastAPI REST Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softmaxshield_api
    command: uvicorn softmaxshield.api.service:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SOFTMAXSHIELD_OFFLINE_MODE=false
      - FASTAPI_PORT=8000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Streamlit Interactive Web Dashboard
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softmaxshield_ui
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

