[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "softmaxshield"
version = "0.1.0"
description = "Multi-layer static verification system that detects hallucinated Python packages, imports, APIs, functions, classes, and invalid keyword arguments in LLM-generated code."
readme = "README.md"
authors = [{ name = "SoftmaxShield Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
softmaxshield = "softmaxshield.cli:main"

